<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora 3D</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f1115;
      color:white;
      padding:20px;
    }

    .container{
      max-width:800px;
      margin:auto;
      background:#1a1d24;
      padding:25px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.4);
    }

    h1{
      text-align:center;
      margin-bottom:30px;
      color:#00c3ff;
    }

    h2{
      margin:25px 0 15px;
      color:#00c3ff;
    }

    .campo{
      margin-bottom:15px;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-size:14px;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#2a2f3a;
      color:white;
      font-size:15px;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:15px;
      border:none;
      border-radius:10px;
      background:#00c3ff;
      color:black;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      opacity:0.85;
    }

    .resultado{
      margin-top:25px;
      background:#222833;
      padding:20px;
      border-radius:12px;
      line-height:1.8;
    }

    .valor{
      color:#00ff88;
      font-weight:bold;
    }

    .lucro{
      color:#ffd000;
      font-weight:bold;
    }

    .final{
      font-size:22px;
      margin-top:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th, td{
      border-bottom:1px solid #444;
      padding:12px;
      text-align:left;
    }

    th{
      color:#00c3ff;
    }

    .btn-excluir{
      background:#ff4444;
      color:white;
      border:none;
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
    }

    .btn-limpar{
      background:#ff4444;
      color:white;
      margin-top:20px;
    }

    @media(max-width:700px){

      table{
        font-size:12px;
      }

      .final{
        font-size:18px;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <h1>🖨️ Calculadora 3D</h1>

    <h2>Configuração Base</h2>

    <div class="campo">
      <label>Valor kWh (R$)</label>
      <input type="number" id="kwh" step="0.01">
    </div>

    <div class="campo">
      <label>Consumo da impressora (Watts)</label>
      <input type="number" id="watts">
    </div>

    <div class="campo">
      <label>Desgaste por hora (R$)</label>
      <input type="number" id="depreciacao" step="0.01">
    </div>

    <h2>Dados da Peça</h2>

    <div class="campo">
      <label>Nome da peça</label>
      <input type="text" id="nome">
    </div>

    <div class="campo">
      <label>Peso da peça (g)</label>
      <input type="number" id="peso" step="0.01">
    </div>

    <div class="campo">
      <label>Preço do filamento (R$/kg)</label>
      <input type="number" id="precoKg" step="0.01">
    </div>

    <div class="campo">
      <label>Tempo de impressão (horas)</label>
      <input type="number" id="tempo" step="0.01">
    </div>

    <div class="campo">
      <label>Custos extras (R$)</label>
      <input type="number" id="extra" step="0.01" value="0">
    </div>

    <div class="campo">
      <label>Lucro (%)</label>
      <input type="number" id="lucro" step="0.01" value="100">
    </div>

    <button onclick="calcular()">Calcular</button>

    <div class="resultado" id="resultado" style="display:none;"></div>

    <h2>📋 Controle de Peças</h2>

    <div class="resultado">

      <table>

        <thead>
          <tr>
            <th>Peça</th>
            <th>Custo</th>
            <th>Venda</th>
            <th>Ação</th>
          </tr>
        </thead>

        <tbody id="tabela"></tbody>

      </table>

      <button class="btn-limpar" onclick="limparMemoria()">
        Limpar Todas as Peças
      </button>

    </div>

  </div>

  <script>

    let memoria = JSON.parse(localStorage.getItem('pecas3d')) || [];

    function salvarMemoria(){
      localStorage.setItem('pecas3d', JSON.stringify(memoria));
    }

    function atualizarTabela(){

      const tabela = document.getElementById('tabela');

      tabela.innerHTML = '';

      memoria.forEach((peca, index) => {

        tabela.innerHTML += `
          <tr>
            <td>${peca.nome}</td>
            <td>R$ ${peca.total.toFixed(2)}</td>
            <td>R$ ${peca.venda.toFixed(2)}</td>
            <td>
              <button class="btn-excluir" onclick="removerPeca(${index})">
                Excluir
              </button>
            </td>
          </tr>
        `;

      });

    }

    function removerPeca(index){

      memoria.splice(index,1);

      salvarMemoria();

      atualizarTabela();

    }

    function limparMemoria(){

      if(confirm('Deseja apagar todas as peças?')){

        memoria = [];

        salvarMemoria();

        atualizarTabela();

      }

    }

    function calcular(){

      const nome = document.getElementById('nome').value;

      const kwh = parseFloat(document.getElementById('kwh').value) || 0;
      const watts = parseFloat(document.getElementById('watts').value) || 0;
      const depreciacao = parseFloat(document.getElementById('depreciacao').value) || 0;

      const peso = parseFloat(document.getElementById('peso').value) || 0;
      const precoKg = parseFloat(document.getElementById('precoKg').value) || 0;
      const tempo = parseFloat(document.getElementById('tempo').value) || 0;
      const extra = parseFloat(document.getElementById('extra').value) || 0;

      const lucro = parseFloat(document.getElementById('lucro').value) || 0;

      const material = (precoKg / 1000) * peso;

      const energia = (watts / 1000) * tempo * kwh;

      const desgaste = tempo * depreciacao;

      const total = material + energia + desgaste + extra;

      const venda = total + (total * (lucro / 100));

      document.getElementById('resultado').style.display = 'block';

      document.getElementById('resultado').innerHTML = `

        <h2>Resultado</h2>

        <p><strong>Peça:</strong> ${nome}</p>

        <p>📦 Material: <span class="valor">R$ ${material.toFixed(2)}</span></p>

        <p>⚡ Energia: <span class="valor">R$ ${energia.toFixed(2)}</span></p>

        <p>🛠️ Desgaste: <span class="valor">R$ ${desgaste.toFixed(2)}</span></p>

        <p>➕ Extras: <span class="valor">R$ ${extra.toFixed(2)}</span></p>

        <hr style="margin:15px 0; border-color:#444;">

        <p>💰 Custo Total: <span class="valor">R$ ${total.toFixed(2)}</span></p>

        <p>📈 Lucro Aplicado: <span class="lucro">${lucro}%</span></p>

        <p class="final">
          🏷️ Valor de Venda:
          <span class="lucro">R$ ${venda.toFixed(2)}</span>
        </p>

      `;

      memoria.push({
        nome: nome,
        total: total,
        venda: venda
      });

      salvarMemoria();

      atualizarTabela();

    }

    atualizarTabela();

  </script>

</body>
</html>
